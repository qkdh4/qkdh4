<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQI Forecast Studio</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="nav-row">
          <h1>AQI Forecast</h1>
          <a class="nav-link" href="/learning">학습 가이드</a>
        </div>
        <p class="muted">도시별 AQI 다음 예측과 권고를 제공합니다.</p>

        <label>도시</label>
        <select id="citySelect"></select>

        <label>입력 윈도우(일) <span id="lookbackVal">21</span></label>
        <input id="lookbackInput" type="range" min="7" max="45" value="21" />

        <label>예측 기간(일) <span id="horizonVal">7</span></label>
        <input id="horizonInput" type="range" min="1" max="14" value="7" />

        <button id="predictBtn">예측 갱신</button>
        <div id="statusBox" class="status">대기 중</div>
      </aside>

      <main class="main">
        <section class="kpi-grid">
          <article class="kpi-card">
            <h3>내일 예측 AQI</h3>
            <p id="kpiNextAqi" class="kpi-value">-</p>
          </article>
          <article class="kpi-card">
            <h3>예측 등급</h3>
            <p id="kpiGrade" class="kpi-value">-</p>
          </article>
          <article class="kpi-card">
            <h3>검증 RMSE</h3>
            <p id="kpiRmse" class="kpi-value">-</p>
          </article>
          <article class="kpi-card">
            <h3>예측 기간 최고 AQI</h3>
            <p id="kpiPeak" class="kpi-value">-</p>
          </article>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>예측 트렌드</h2>
            <p id="trendSummary" class="muted"></p>
          </div>
          <div class="chart-wrap">
            <canvas id="forecastChart"></canvas>
          </div>
        </section>

        <section class="two-col">
          <section class="panel">
            <h2>일자별 예측</h2>
            <table id="forecastTable">
              <thead>
                <tr>
                  <th>날짜</th>
                  <th>AQI</th>
                  <th>등급</th>
                  <th>건강 권고</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </section>
          <section class="panel">
            <h2>예측 카드</h2>
            <div id="forecastCards" class="cards"></div>
          </section>
        </section>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
  </html>
